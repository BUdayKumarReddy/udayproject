version: '3'

services:

  mysql:
    image: mysql:8
    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb

    ports:
      - "3306:3306"

  backend:
    build: ./backend

    container_name: backend

    ports:
      - "8081:8080"

    depends_on:
      - mysql

  frontend:
    build: ./frontend

    container_name: frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend
